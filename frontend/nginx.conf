server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compress text assets and API JSON. text/event-stream is deliberately absent so SSE is never buffered.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy /api/* to the backend service (helmet sets the API's own security headers)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend trusts one proxy hop (TRUST_PROXY=1) for per-client rate limiting
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlates nginx access logs with backend JSON logs
        proxy_set_header X-Request-Id $request_id;
        # Matches express.json({ limit: '2mb' })
        client_max_body_size 2m;
        # Required for SSE streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Long generations; the backend also sends a heartbeat every 15s
        proxy_read_timeout 300s;
    }

    # Content-hashed build output never changes under the same URL
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA entry and fallback: always revalidate so a new deploy is picked up immediately
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
