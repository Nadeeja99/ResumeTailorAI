# Security headers for the static SPA. Included per location because nginx drops inherited
# add_header directives in any location that declares its own (e.g. Cache-Control).
#
# CSP notes:
# - script-src allows the pre-paint theme script in index.html by hash. If that script changes,
#   update the hash (src/test/nginx.test.ts fails until you do).
# - style-src needs 'unsafe-inline' for React style attributes (progress widths, paper fonts).
# - img-src data:/blob: is used by html2canvas/jsPDF exports; worker-src blob: by pdf.js.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-W8eL2UjoBlfp78eH5fKAZ7NMOM1MD6BUvuQ3FDOdsWg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Enable once served over HTTPS (or set it at your TLS terminator):
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
