<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeTailorAI - AI-Powered Resume Optimization</title>
    <meta name="description" content="AI-powered resume optimization tool that analyzes job descriptions and tailors your resume for maximum ATS compatibility and recruiter impact." />
    <meta name="author" content="ResumeTailorAI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="ResumeTailorAI - AI-Powered Resume Optimization" />
    <meta property="og:description" content="AI-powered resume optimization tool that analyzes job descriptions and tailors your resume for maximum ATS compatibility and recruiter impact." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ResumeTailorAI - AI-Powered Resume Optimization" />
    <meta name="twitter:description" content="AI-powered resume optimization tool that analyzes job descriptions and tailors your resume for maximum ATS compatibility and recruiter impact." />
    <meta name="twitter:image" content="/favicon.svg" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash.
         Keep the storage key in sync with THEME_STORAGE_KEY in src/components/theme/ThemeProvider.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rt-theme');
          var dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
