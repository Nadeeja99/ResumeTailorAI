name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # npm 11.4.x crashes resolving this repo's dependency tree ("reading 'edgesOut'"); 11.21 is fine
  NPM_VERSION: 11.21.0

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright smoke (mocked API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker build + smoke
    runs-on: ubuntu-latest
    env:
      # Non-empty so the production backend boots; no real AI calls are made
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers" | grep -i "content-security-policy: default-src 'self'"
          echo "$headers" | grep -i "x-content-type-options: nosniff"
          curl -fsS http://localhost:8080/api/health | grep '"status":"ok"'
          curl -fsSI "http://localhost:8080/assets/$(curl -fsS http://localhost:8080/ | grep -o 'index-[^"]*\.js' | head -1)" | grep -i "immutable"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
